<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yunji.dev</title>
  <script>
    // 플래시 방지 — 스타일 적용 전에 테마 속성 세팅
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* 기본(light) */
    :root {
      --bg: #ffffff;
      --bg-soft: #f4f5f7;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111418;
      --muted: #5f6673;
      --accent: #ff6b4a;
      --shadow: 0 1px 2px rgba(15, 17, 21, 0.04), 0 1px 3px rgba(15, 17, 21, 0.06);
    }
    /* dark 오버라이드 */
    [data-theme="dark"] {
      --bg: #0f1115;
      --bg-soft: #171a21;
      --card: #1d2029;
      --border: #262a36;
      --text: #ececf1;
      --muted: #8b90a0;
      --accent: #ff6b4a;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 160ms ease, color 160ms ease;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 48px;
    }
    .projects {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .project {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: border-color 150ms ease, transform 150ms ease;
    }
    .project:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .project .emoji {
      font-size: 36px;
      line-height: 1;
    }
    .project .info h2 {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 700;
    }
    .project .info p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .project .arrow {
      margin-left: auto;
      color: var(--muted);
      font-size: 18px;
    }
    .project:hover .arrow { color: var(--accent); }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: border-color 120ms ease, transform 120ms ease;
    }
    .theme-toggle:hover { border-color: var(--accent); transform: scale(1.05); }
    .theme-toggle:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환" title="라이트/다크 전환">☀️</button>

  <div class="wrap">
    <h1>yunji<span>.dev</span></h1>
    <p class="subtitle">프로젝트 모음</p>

    <div class="projects">
      <a class="project" href="/review-check/">
        <div class="emoji">🍜</div>
        <div class="info">
          <h2>이 집.. 진짜 맛집일까?</h2>
          <p>네이버 리뷰 분석으로 맛집 신뢰도를 판별하는 데모</p>
        </div>
        <div class="arrow">&rarr;</div>
      </a>
    </div>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      function apply(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          btn.textContent = '🌙';
        } else {
          document.documentElement.removeAttribute('data-theme');
          btn.textContent = '☀️';
        }
      }
      apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        apply(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
