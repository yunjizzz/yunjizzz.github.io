<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yunji.dev</title>
  <style>
    :root {
      --bg: #0f1115;
      --bg-soft: #171a21;
      --card: #1d2029;
      --border: #262a36;
      --text: #ececf1;
      --muted: #8b90a0;
      --accent: #ff6b4a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 48px;
    }
    .projects {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .project {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 150ms ease, transform 150ms ease;
    }
    .project:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .project .emoji {
      font-size: 36px;
      line-height: 1;
    }
    .project .info h2 {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 700;
    }
    .project .info p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .project .arrow {
      margin-left: auto;
      color: var(--muted);
      font-size: 18px;
    }
    .project:hover .arrow { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>yunji<span>.dev</span></h1>
    <p class="subtitle">프로젝트 모음</p>

    <div class="projects">
      <a class="project" href="/review-check/">
        <div class="emoji">🍜</div>
        <div class="info">
          <h2>이 집.. 진짜 맛집일까?</h2>
          <p>네이버 리뷰 분석으로 맛집 신뢰도를 판별하는 데모</p>
        </div>
        <div class="arrow">&rarr;</div>
      </a>
    </div>
  </div>
</body>
</html>
