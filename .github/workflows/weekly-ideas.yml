name: Weekly Utility Ideas Report

on:
  schedule:
    # 매주 월요일 오전 9시 (KST, UTC+9 -> 일요일/월요일 경계 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ideas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate weekly utility ideas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_ideas.py

      - name: Commit and push updated IDEAS.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IDEAS.md
          if git diff --cached --quiet; then
            echo "변경 사항이 없습니다."
          else
            TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "chore(ideas): ${TODAY} 주간 유틸리티 아이디어 리포트 추가"
            git push
          fi
