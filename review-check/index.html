    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Y644EYN1VZ');
  </script>
  <script>
    // 플래시 방지 — 스타일시트 로드 전에 테마 속성 세팅
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환" title="라이트/다크 전환">☀️</button>

  <div class="wrap">
    <header class="hero">
      <h1 class="title">이 집.. <span class="accent">진짜 맛집일까?</span></h1>
      <p class="subtitle">리뷰 분석을 통해 내 소중한 한끼를 지켜봐요</p>

      <form id="search-form" class="search" role="search">
        <input id="q" type="text" placeholder="가게 이름이나 지역을 검색해보세요 (예: 칼국수, 망원)" autocomplete="off" />
        <button type="submit">검색</button>
      </form>

      <div class="suggest">
        <button class="chip" data-q="할매손칼국수">할매손칼국수</button>
        <button class="chip" data-q="인스타감성 브런치카페">인스타감성 브런치카페</button>
        <button class="chip" data-q="24시 골목분식">24시 골목분식</button>
        <button class="chip" data-q="프리미엄 한우다이닝">프리미엄 한우다이닝</button>
        <button class="chip" data-q="동네돈까스">동네돈까스</button>
      </div>

      <div class="hint">💡 <b>네이버 리뷰 크롤링 데이터</b> 기준으로 분석 — 현재는 샘플 5개 가게로 시연합니다</div>
    </header>

    <main id="result" class="result">
      <div class="empty">위에서 가게를 검색하면 분석 결과가 나타납니다.</div>
    </main>
  </div>

  <script>
    // 테마 토글
    (function () {
      var btn = document.getElementById('theme-toggle');
      function apply(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          btn.textContent = '🌙';
        } else {
          document.documentElement.removeAttribute('data-theme');
          btn.textContent = '☀️';
        }
      }
      // 초기 아이콘 동기화
      apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        apply(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
