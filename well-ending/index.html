<style>
:root{
  --n-bg:#F3F5F4;--n-ink:#20262B;--n-muted:#5B646B;--n-line:#D3D8D8;--n-accent:#3D5A6E;--n-surface:#FCFDFC;--n-on:#FFFFFF;
  --c-bg:#E1E6EB;--c-ink:#26303B;--c-muted:#56626E;--c-line:#BCC5CE;--c-accent:#445F79;--c-surface:#F0F3F5;--c-on:#FFFFFF;
  --w-bg:#F9E6CE;--w-ink:#3A2517;--w-muted:#74533B;--w-line:#E3C19C;--w-accent:#8A560E;--w-surface:#FDF3E5;--w-on:#FFFFFF;
  --danger:#A23B2E;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --n-bg:#262B31;--n-ink:#E8EBED;--n-muted:#A8B0B7;--n-line:#444C55;--n-accent:#A6C0D3;--n-surface:#313840;--n-on:#14181C;
    --c-bg:#242D39;--c-ink:#D8DFE7;--c-muted:#98A4B1;--c-line:#3F4B5A;--c-accent:#9DBBD6;--c-surface:#2F3A48;--c-on:#121820;
    --w-bg:#3B291C;--w-ink:#F6E3CC;--w-muted:#CFB096;--w-line:#5F4532;--w-accent:#EDB96C;--w-surface:#4B3626;--w-on:#2B1D13;
    --danger:#E58A7C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --n-bg:#262B31;--n-ink:#E8EBED;--n-muted:#A8B0B7;--n-line:#444C55;--n-accent:#A6C0D3;--n-surface:#313840;--n-on:#14181C;
  --c-bg:#242D39;--c-ink:#D8DFE7;--c-muted:#98A4B1;--c-line:#3F4B5A;--c-accent:#9DBBD6;--c-surface:#2F3A48;--c-on:#121820;
  --w-bg:#3B291C;--w-ink:#F6E3CC;--w-muted:#CFB096;--w-line:#5F4532;--w-accent:#EDB96C;--w-surface:#4B3626;--w-on:#2B1D13;
  --danger:#E58A7C;color-scheme:dark;
}
:root[data-mode="neutral"]{--bg:var(--n-bg);--ink:var(--n-ink);--muted:var(--n-muted);--line:var(--n-line);--accent:var(--n-accent);--surface:var(--n-surface);--on:var(--n-on)}
:root[data-mode="cold"]{--bg:var(--c-bg);--ink:var(--c-ink);--muted:var(--c-muted);--line:var(--c-line);--accent:var(--c-accent);--surface:var(--c-surface);--on:var(--c-on)}
:root[data-mode="warm"]{--bg:var(--w-bg);--ink:var(--w-ink);--muted:var(--w-muted);--line:var(--w-line);--accent:var(--w-accent);--surface:var(--w-surface);--on:var(--w-on)}
/* 엔딩노트 안내 화면: 기기 설정과 상관없이 항상 밝은 화면. 포인트 색은 --accent 한 곳만 바꾸면 됨 */
:root[data-mode="bright"]{--bg:#FFFBF5;--ink:#33261C;--muted:#7C6B5D;--line:#EFE2D0;--accent:#D9772B;--surface:#FFFFFF;--on:#FFFFFF;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);transition:background-color .8s}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;transition:background-color .8s,color .8s;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.feed,.page,.scene,.sheet{scrollbar-width:none}
.feed::-webkit-scrollbar,.page::-webkit-scrollbar,.scene::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 16px}
.prog{padding-top:12px}
.seg{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .7s ease}
.bar{display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-size:13px;color:var(--muted)}
.act{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-no{font-weight:700;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 12px;min-height:36px;font-size:13px;color:var(--ink);cursor:pointer}

.scene{flex:1;min-height:0;display:flex;flex-direction:column}
.trow{display:flex;align-items:baseline;gap:12px;margin:6px 0 10px}
.time{font-family:'Gowun Batang',serif;color:var(--accent);margin:0;line-height:1;letter-spacing:-.02em;font-size:clamp(36px,11vw,56px);font-variant-numeric:tabular-nums}
.time .ampm{font-size:.32em;letter-spacing:0;margin-right:.25em;vertical-align:.12em}
.title{font-size:15px;font-weight:500;color:var(--muted);margin:0}

.chat{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden;transition:background-color .8s}
.chat-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.chat-h small{font-weight:400;color:var(--muted)}
.feed{flex:1;overflow-y:auto;padding:14px 12px 18px;cursor:pointer;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
.feed>*{margin:0 0 10px}
.in{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nar{font-family:'Gowun Batang',serif;font-size:16px;line-height:1.75;color:var(--ink);text-align:center;padding:4px 10px;word-break:keep-all}
.nar.old{color:var(--muted)}
/* 종이 없이 글씨체만 손글씨인 한 줄 */
.hand{font-family:'Nanum Pen Script','Gowun Batang',cursive;font-size:28px;line-height:1.35;color:var(--ink);text-align:center;margin:0;padding:6px 10px 8px;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:86%}
.msg .av{margin-top:2px}
.nm{display:block;font-size:12px;color:var(--muted);margin:0 0 3px 2px}
.bub{background:var(--bg);border-radius:4px 16px 16px 16px;padding:9px 12px;font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.ur{font-size:11px;font-weight:700;color:var(--accent);align-self:flex-end;margin-bottom:2px}
.msg.me{margin-left:auto;flex-direction:column;align-items:flex-end}
.msg.me .bub{background:var(--accent);color:var(--on);border-radius:16px 4px 16px 16px}
.msg.me.fail .bub{background:transparent;color:var(--ink);border:1.5px dashed var(--danger)}
.st{font-size:11px;color:var(--muted);margin-top:3px}
.st.fail{color:var(--danger);font-weight:700}
.shk{animation:shk .5s ease}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.noti{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5}
.noti .ic{width:28px;height:28px;flex:none;border-radius:8px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-size:13px;font-weight:700}
.noti b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.noti.alert{border:1.5px solid var(--danger)}
.noti.alert .ic{background:var(--danger)}
/* 사진 메시지: 흰 테두리 인화 사진. 안은 흐릿한 빛만(무엇이 찍혔는지는 그리지 않음) */
.photo{display:block;width:150px;margin:2px 0 8px;padding:5px 5px 14px;background:#FBF8F1;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.28);transform:rotate(-2deg)}
.photo svg{display:block;width:100%;height:auto;border-radius:1px}
/* 손글씨 메모: 줄 노트(가로줄 + 왼쪽 여백선) 위에 펜글씨 */
.paper{font-family:'Nanum Pen Script','Gowun Batang',cursive;color:#2E2A3A;border-radius:3px;padding:6px 16px 8px 34px;font-size:23px;line-height:30px;letter-spacing:.2px;box-shadow:0 1px 3px rgba(0,0,0,.18);word-break:keep-all;
  background:linear-gradient(90deg,transparent 23px,#E9A7A0 23px,#E9A7A0 24px,transparent 24px),repeating-linear-gradient(#FFF9EC 0,#FFF9EC 29px,#CFDAE6 29px,#CFDAE6 30px) 0 4px;background-color:#FFF9EC}
.vid{display:flex;align-items:center;gap:10px}
.play{width:30px;height:30px;border-radius:50%;background:var(--on);color:var(--accent);display:grid;place-items:center;font-size:12px;flex:none}
.sub{font-family:'Gowun Batang',serif;font-size:17px;line-height:1.7}
.av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;background:var(--bg);border:1px solid var(--line)}
.actbox{border:1.5px solid var(--accent);border-radius:16px;padding:14px;background:var(--bg);cursor:default}
.act-q{font-size:14px;font-weight:500;margin:0 0 10px;word-break:keep-all}
.qrs{display:flex;flex-wrap:wrap;gap:8px}
.qr{border:1px solid var(--accent);background:transparent;color:var(--ink);border-radius:999px;min-height:42px;padding:0 14px;font-size:15px;cursor:pointer;text-align:left}
.skip{display:block;margin:10px 0 0;background:none;border:0;padding:6px 0;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer}
.chat-in{display:flex;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid var(--line)}
.chat-in span{flex:1;min-height:38px;border-radius:999px;background:var(--bg);display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--muted)}
.chat-in i{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;color:var(--muted)}
.feed.cfeed{padding:2px 0 18px}
.est{margin:0 0 16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.est img{display:block;width:100%;aspect-ratio:1400/781;object-fit:cover}
.paper.solo{max-width:86%;margin-left:auto;margin-right:auto}
.unheard{display:block;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;color:var(--danger);margin-top:2px}
.hint{font-size:12px;color:var(--muted);text-align:center}
.closing{font-family:'Gowun Batang',serif;font-size:clamp(22px,6vw,28px);line-height:1.5;color:var(--ink);text-align:center;margin:20px 6px 6px;word-break:keep-all;white-space:pre-line;animation:rise .8s ease both}
.foot{padding-top:12px}
.nav{display:flex;gap:10px;padding-bottom:14px}
.btn{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:transparent;font-size:16px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.slim{flex:0 0 auto;padding:0 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.clock svg{display:block;width:100%;height:150px}
.s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;opacity:.8}
.as{stroke:var(--accent);opacity:1}
.a{fill:var(--accent)}
.hands{transform-box:view-box;transform-origin:160px 75px}
.hands.go{animation:back 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes back{to{transform:rotate(-1080deg)}}
.page{flex:1;overflow-y:auto;padding:8px 6px 20px;margin:0 -6px}
.h1{font-family:'Gowun Batang',serif;font-size:clamp(28px,8vw,40px);line-height:1.35;margin:6px 0 14px;font-weight:700;word-break:keep-all}
.lead{font-size:15px;line-height:1.75;color:var(--muted);margin:0 0 26px;word-break:keep-all}
.field{display:block;margin-bottom:20px}
.field>span{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.field>small{display:block;font-size:13px;color:var(--muted);margin:-2px 0 8px}
.input{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
textarea.input{padding:12px 14px;min-height:84px;resize:none;line-height:1.6}
.err{font-size:13px;color:var(--danger);margin:-10px 0 16px;min-height:1em}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.fam-list{list-style:none;margin:0 0 16px;padding:0}
.fm{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.fm-name{flex:1;min-width:0;font-size:16px;font-weight:500}
.fm-name small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.link{background:none;border:0;padding:8px 6px;min-height:40px;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.add{width:100%;min-height:52px;border-radius:14px;border:1px dashed var(--line);background:transparent;font-size:15px;cursor:pointer}
.add:disabled{opacity:.45;cursor:not-allowed}
.empty{font-size:14px;color:var(--muted);padding:18px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{font-size:18px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;justify-content:center;min-height:42px;min-width:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:15px}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{list-style:none;padding:0;margin:0 0 20px}
.checks label{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px;line-height:1.6;word-break:keep-all}
.checks input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.checks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.progress{font-family:'Gowun Batang',serif;font-size:44px;color:var(--accent);margin:0}
/* 엔딩노트 안내 화면 */
.en-k{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin:18px 0 0}
.en-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 12px}
.en-h h2{font-family:'Gowun Batang',serif;font-size:20px;margin:0}
.en-h span{font-size:13px;color:var(--muted);flex:none}
.en-h b{color:var(--accent);font-size:15px}
.en-page{display:flex;flex-direction:column;padding-top:4px;padding-bottom:4px;font-size:24px}
.en-cap{text-align:center;margin:10px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:block;cursor:pointer}
.tile input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tile-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;height:100%;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);padding:14px 10px 14px;transition:border-color .2s}
.tile svg{width:100%;max-width:150px;height:auto;margin-bottom:8px}
.tile b{font-size:15px;font-weight:700;word-break:keep-all}
.tile small{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:keep-all}
.tile i{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:transparent}
.tile input:checked+.tile-in{border-color:var(--accent)}
.tile input:checked+.tile-in i{background:var(--accent);border-color:var(--accent);color:var(--on)}
.tile input:focus-visible+.tile-in{outline:2px solid var(--accent);outline-offset:2px}
.en-how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.en-how li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13.5px;font-weight:500;line-height:1.4;word-break:keep-all}
.en-how span{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:25px}
.keeps{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 20px;background:var(--surface)}
.keeps h2{font-size:15px;margin:0 0 4px}
.keeps dl{margin:0}
.keeps dt{font-size:12px;color:var(--muted);margin-top:12px}
.keeps dd{margin:3px 0 0;font-family:'Gowun Batang',serif;font-size:16px;line-height:1.6;word-break:keep-all}
/* ---------- 눈뜨는 연출 ---------- */
.eye{position:fixed;inset:0;z-index:50;overflow:hidden;background:#000;cursor:pointer;animation:eyeIn .3s ease both;transition:opacity 1s ease}
.eye.out{opacity:0;pointer-events:none}
.eye-view{position:absolute;inset:-6%;animation:eyeFocus 5s 2.6s ease-out both}
.eye-view{background-color:#000;background-size:cover;background-position:32% 50%;background-repeat:no-repeat}
.eye.cold .eye-view{background-image:url(img/eye-start.jpg);--blur:2px;--sat:.9}
.eye.warm .eye-view{background-image:url(img/eye-end.jpg);--blur:0px;--sat:1}
.eye-hole{position:absolute;left:-25%;width:150%;top:50%;height:0;transform:translateY(-50%);border-radius:50%;box-shadow:inset 0 0 5vh 2vh #000,0 0 0 200vmax #000;animation:eyeHole 5s 2.6s ease-in-out both}
.eye-line{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;padding:0 28px;text-align:center;font-family:'Gowun Batang',serif;font-size:19px;line-height:1.7;color:#D5D9DD;word-break:keep-all;opacity:0;animation:eyeLine 2.5s .3s ease both}
.eye-dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;animation:eyeDim 1.4s 8.2s ease both}
.eye-phone{position:absolute;left:50%;top:66%;width:22vmin;height:44vmin;border-radius:3.5vmin;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(-7deg);animation:eyePhone 2.5s 8.2s ease-in-out both}
.eye.cold .eye-phone{background:var(--c-bg);color:var(--c-accent);box-shadow:0 0 9vmin 1vmin rgba(200,215,235,.35)}
.eye.warm .eye-phone{background:var(--w-bg);color:var(--w-accent);box-shadow:0 0 9vmin 1vmin rgba(255,225,170,.5)}
.eye-phone b{font-family:'Gowun Batang',serif;font-weight:400;font-size:5.4vmin;letter-spacing:-.02em;animation:eyePhoneTxt 2.5s 8.2s ease both}
/* 이야기를 다시 볼 때는 같은 연출을 절반 이하 길이로 */
.eye.fast .eye-line{animation-duration:1.3s;animation-delay:.1s}
.eye.fast .eye-view,.eye.fast .eye-hole{animation-duration:2.2s;animation-delay:1.2s}
.eye.fast .eye-dim{animation-duration:.8s;animation-delay:3.2s}
.eye.fast .eye-phone,.eye.fast .eye-phone b{animation-duration:1.5s;animation-delay:3.2s}
@keyframes eyeDim{from{opacity:0}to{opacity:.6}}
@keyframes eyePhone{0%{opacity:0;top:68%;width:22vmin;height:44vmin;border-radius:3.5vmin;transform:translate(-50%,-50%) rotate(-7deg)}28%,52%{opacity:1;top:66%;width:22vmin;height:44vmin;border-radius:3.5vmin;transform:translate(-50%,-50%) rotate(-7deg)}100%{opacity:1;top:50%;width:112vw;height:112vh;border-radius:0;transform:translate(-50%,-50%) rotate(0)}}
@keyframes eyePhoneTxt{0%,52%{opacity:1}72%,100%{opacity:0}}
@keyframes eyeIn{from{opacity:0}to{opacity:1}}
@keyframes eyeFocus{0%{filter:blur(22px) saturate(var(--sat));transform:scale(1.08)}60%{filter:blur(10px) saturate(var(--sat));transform:scale(1.04)}100%{filter:blur(var(--blur)) saturate(var(--sat));transform:scale(1)}}
@keyframes eyeHole{0%,6%{height:0}15%{height:12vh}23%,33%{height:0}45%{height:32vh}53%{height:26vh}60%{height:3vh}72%{height:50vh}80%{height:46vh}100%{height:240vh}}
@keyframes eyeLine{0%{opacity:0}28%,68%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.feed{scroll-behavior:auto}}
</style>

<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<script>
(function(){
const KEY='lastMorning:v2', MAX=5;
const RELS=['배우자','자녀','부모','형제자매','반려동물','기타'];
const AGES=[['아기','0~3세'],['어린이','4~12세'],['청소년','13~18세'],['성인','19세 이상']];
const STEPS=['intro','family','open','u:phone','u:drawer','u:funeral','u:money','u:fifth','u:last','rewind','p:phone','p:drawer','p:funeral','p:money','p:fifth','p:last','summary','ending','check'];
const STORY=STEPS.slice(2,18);
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let S={userName:'',lastWords:'',family:[],step:0,revealed:1,checks:{},acts:{}};
try{let raw=localStorage.getItem(KEY)||localStorage.getItem('lastMorning:v1');if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.family))S=Object.assign(S,o);}}catch(e){}
if(!S.acts)S.acts={};
if(!STEPS[S.step])S.step=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById('app'), sheetEl=document.getElementById('sheet');
let sheet=null, animIdx=-1, busy=false;

function jong(w){const c=(w||'').trim().slice(-1);if(!c)return null;const k=c.charCodeAt(0);
  if(k>=0xAC00&&k<=0xD7A3)return (k-0xAC00)%28!==0;if(/[0-9]/.test(c))return '013678'.includes(c);return null;}
/* 받침으로 끝나는 자녀 이름은 부를 때처럼 '-이'를 붙임: 하준 → 하준이(가/는/를/와/에게/의) */
function K(w){return jong(w)===true&&S.family.some(m=>m.relation==='자녀'&&m.name===w)?w+'이':w;}
function J(w,t){w=K(w);const m={'은':['은','는'],'이':['이','가'],'을':['을','를'],'과':['과','와']}[t];const h=jong(w);
  if(h===null)return w+m[0]+'('+m[1]+')';return w+(h?m[0]:m[1]);}
function voc(w){const h=jong(w);return h===null?w:w+(h?'아':'야');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Math.random().toString(36).slice(2,10);}
function ageOf(m){return m&&m.relation==='자녀'?(m.age||'성인'):'성인';}
function isYoung(m){const g=ageOf(m);return g==='아기'||g==='어린이';}
function canPlay(m,scene){const g=ageOf(m);
  if(g==='아기'||g==='어린이')return scene==='last';
  if(g==='청소년')return !['drawer','money','funeral'].includes(scene);return true;}
function sibTitle(m){
  if(!m||m.relation!=='형제자매'||!m.older||!m.sg||!S.userGender)return '';
  return S.userGender==='여'?(m.sg==='여'?'언니':'오빠'):(m.sg==='여'?'누나':'형');
}
function myTitleFor(m){
  if(!m||m.relation!=='형제자매'||m.older!==false||!m.sg||!S.userGender)return '';
  return m.sg==='여'?(S.userGender==='여'?'언니':'오빠'):(S.userGender==='여'?'누나':'형');
}
function dispName(m){const t=sibTitle(m);return t?`${m.name} ${t}`:m.name;}
function DF(){return S.family.map(m=>Object.assign({},m,{name:dispName(m)}));}
function relLabel(m){
  if(m.relation==='자녀'&&m.age)return `자녀, ${m.age}`;
  if(m.relation==='형제자매'&&m.sg)return `형제자매, ${m.older?'손위':'손아래'} ${m.sg==='여'?'여자':'남자'}`;
  return m.relation;
}
const G=name=>({id:'',name,relation:'기타'});

function assign(){
  const fam=DF(), humans=fam.filter(m=>m.relation!=='반려동물'), pets=fam.filter(m=>m.relation==='반려동물');
  const cnt=new Map(humans.map(m=>[m.id,0]));
  const pick=(prefs,ex,scene)=>{const c=humans.filter(m=>!(ex||[]).includes(m.id)&&canPlay(m,scene));if(!c.length)return null;
    let best=null,bs=Infinity;c.forEach((m,i)=>{let pi=prefs.indexOf(m.relation);if(pi<0)pi=prefs.length;const s=pi+cnt.get(m.id)*2+i*.01;if(s<bs){bs=s;best=m;}});
    cnt.set(best.id,cnt.get(best.id)+1);return best;};
  const a={};
  a.phone=pick(['배우자','부모','자녀','형제자매','기타'],[],'phone');
  a.drawer=pick(['부모','배우자','형제자매','자녀','기타'],[],'drawer');
  a.fa=pick(['형제자매','부모','배우자','자녀','기타'],[],'funeral');
  a.fb=pick(['부모','형제자매','자녀','배우자','기타'],a.fa?[a.fa.id]:[],'funeral');
  a.money=pick(['배우자','형제자매','부모','자녀','기타'],[],'money');
  a.pet=pets[0]||null;
  a.fifth=pick(['자녀','배우자','형제자매','부모','기타'],[],'fifth');
  a.last=pick(['자녀','배우자','형제자매','부모','기타'],[],'last');
  a.adults=humans.filter(m=>!isYoung(m));
  return a;
}
function other(a,ex,scene){return a.adults.find(m=>!ex.includes(m&&m.id)&&canPlay(m,scene||'drawer'))||null;}

/* ---------- 비트 ---------- */
const N=text=>({t:'n',text}), C=(m,text)=>({t:'c',m,text}), PH=(m,text)=>({t:'photo',m,text}),
  NOTE=(m,text)=>({t:'note',m,text}), NO=(app,text,ic,alert)=>({t:'noti',app,text,ic,alert}), VID=(label,sub)=>({t:'video',label,sub}), HAND=text=>({t:'hand',text}),
  ACT=o=>Object.assign({t:'act'},o);
const META={
  open:{t:['오전','6:40'],title:'눈을 뜬 아침'},phone:{t:['오전','9:12'],title:'잠긴 휴대폰'},
  drawer:{t:['새벽','2:30'],title:'서랍 속 파란 파일'},funeral:{t:['오후','4:05'],title:'장례식장 복도'},
  money:{t:['오전','11:20'],title:'몰랐던 통장'},pet:{t:['오후','7:40'],title:'비어 있는 밥그릇'},
  sub:{t:['오후','8:15'],title:'결제 완료 알림'},last:{t:['오후','11:58'],title:'마지막 말'},
  ending:{t:['오전','6:40'],title:'다시, 아침'}
};
function joinNames(list){const n=list.map(m=>m.name);if(n.length===1)return n[0];if(n.length===2)return J(n[0],'과')+' '+n[1];return n.slice(0,-1).join(', ')+', 그리고 '+n[n.length-1];}
function words(){return S.lastWords&&S.lastWords.trim()?S.lastWords.trim():'늘 고마웠어. 너무 오래 슬퍼하지 마.';}

function polite(m){
  if(!m||m.elder||m.relation==='부모'||m.relation==='형제자매'||m.relation==='반려동물')return false;
  const f=S.family, has=r=>f.some(x=>x.relation===r&&x.id!==m.id&&!isYoung(x));
  if(has('부모'))return true;
  if(m.relation==='자녀'&&has('형제자매'))return true;
  if(m.relation==='기타')return f.some(x=>x.id!==m.id&&!isYoung(x)&&x.relation!=='반려동물');
  return false;
}
function variantOf(key){
  const order=['open','phone','drawer','funeral','money','pet','sub','last','baby','ending'];
  return ((S.seed||0)+order.indexOf(key))%3;
}
function build(key,ver,a){
  const U=ver==='u', me=S.userName||'나';
  /* 글로 풀어 쓰는 장면(chat:'prose')에서 대사를 “…” 누가 말했다. 형태의 내레이션으로 바꾼다 */
  const say=(c,verb)=>N(`“${c.text}${/[.?!…]$/.test(c.text)?'':(verb==='물었다.'?'?':'.')}” ${J(c.m.name,'이')} ${verb}`);
  const said=k=>!!(S.said&&S.said[k]&&typeof S.acts[k]==='string'); /* 준비되지 않은 하루에서 직접 고른 말인지 */
  const T=(m,b,j,force)=>C(m,(force||polite(m))?j:b);
  const TR=(m,to,b,j)=>C(m,(to&&(to.elder||(to.relation==='부모'&&m.relation!=='부모'&&m.relation!=='형제자매')))?j:b);
  const TP=(m,b,j)=>PH(m,polite(m)?j:b);
  const R=m=>{if(!m||m.relation==='자녀')return '';const t=myTitleFor(m);return (t||me)+' ';};
  const RS=m=>{const r=R(m).trim();return r?J(r,'이')+' ':'';};
  const v=variantOf(key);
  const pick=arr=>arr[v%arr.length];
  switch(key){
  case 'open':{const f=DF(), ad=a.adults, x=ad[0]||G('가족'), y=ad[1]||null;
    const baby=f.find(m=>ageOf(m)==='아기');
    const who=f.length===1?`거실에 ${J(f[0].name,'이')} 혼자 앉아 있었다.`:`거실에 ${J(joinNames(f),'이')} 모두 모여 있었다.`;
    const chat=pick([
      [T(x,`알람이 계속 울리는데 ${R(x)}안 일어나`,`알람이 계속 울리는데 ${R(x)}안 일어나요`), ...(y?[TR(y,x,'피곤한가 보지. 좀 더 자게 둬','피곤한가 봐요. 조금 더 자게 두세요')]:[]), T(x,'아니야, 이상해. 흔들어도 안 깨','아니에요, 이상해요. 흔들어도 안 깨요')],
      [T(x,'누구 좀 와 봐','누가 좀 와 주세요'), ...(y?[TR(y,x,'왜? 무슨 일이야','왜요? 무슨 일이에요')]:[]), T(x,`${R(x)}아무리 깨워도 안 일어나`,`${R(x)}아무리 깨워도 안 일어나요`)],
      [T(x,'119 불렀어','119 불렀어요'), ...(y?[TR(y,x,'뭐? 무슨 일이야','네? 무슨 일이에요')]:[]), T(x,`${R(x)}숨을 안 쉬어`,`${R(x)}숨을 안 쉬어요`)]
    ]);
    return {chat:'group',beats:[
      N('알람이 울리기도 전에 눈이 떠졌다.'),
      N('몸이 이상하게 가벼웠다.'),
      NO('알람','오전 6:40','⏰'),
      N(pick(['알람을 끄려는데, 손가락이 화면에 닿지 않았다.','알람이 울렸다. 아무리 눌러도 꺼지지 않았다.','알람이 한참을 울렸다. 끄려 해도 꺼지지 않았다.'])), ...chat,
      N(who), N('식탁 위에는 내가 어제 쓰던 컵이 그대로 놓여 있었다.'), ...(baby&&f.length>1?[N(`${K(baby.name)}만 아무것도 모른 채 놀고 있었다.`)]:[]),
      N('“다들 왜 그래?” 아무도 대답하지 않았다.'),
      N('현관 거울 앞을 지나는데, 거울 속엔 아무도 없었다.'),N('그제야 알았다. 나는 어젯밤 잠든 채로, 깨어나지 못했다.'),N('어젯밤의 “잘 자”가, 이 집에 남긴 마지막 인사였다.')]};}

  case 'phone':{const n=a.phone||G('가족'), o=other(a,[n.id],'phone');
    const pin=NO('잠금','비밀번호를 여러 번 틀렸습니다. 30초 후에 다시 시도하세요.','🔒',true);
    if(U) return {chat:'group',input:true,beats:[
      N(`${J(n.name,'이')} 내 휴대폰을 붙잡고 있었다. 영정 사진을 찾으려는 거였다.`),
      ...pick([
        [T(n,`혹시 ${R(n)}휴대폰 비밀번호 아는 사람?`,`혹시 ${R(n)}휴대폰 비밀번호 아시는 분 계세요?`), ...(o?[TR(o,n,'생일로 해봤어?','생일로 해보셨어요?')]:[]), pin,
          T(n,'생일, 기념일 다 해봤어. 안 열려','생일, 기념일 다 해봤는데 안 열려요'), N('그 안에 우리 사진이 몇천 장인데, 한 장도 꺼낼 수 없었다.')],
        [T(n,'영정 사진으로 쓸 만한 거 있는 사람?','영정 사진으로 쓸 만한 거 갖고 계신 분 있으세요?'), ...(o?[TR(o,n,'휴대폰에 많을 텐데','휴대폰에 많을 거예요')]:[]), pin,
          T(n,'잠겨서 안 열려. 결국 다 옛날 사진뿐이야','잠겨서 안 열려요. 결국 다 옛날 사진뿐이에요'), N('가장 최근에 웃고 있던 내 얼굴은, 잠긴 화면 너머에 있었다.')],
        [T(n,'얼굴 인식도 안 되고 비밀번호도 모르겠어','얼굴 인식도 안 되고 비밀번호도 모르겠어요'), ...(o?[TR(o,n,'통신사 가면 열어주지 않을까?','통신사 가면 열어주지 않을까요?')]:[]), pin,
          T(n,'본인 아니면 안 된대','본인 아니면 안 된대요'), N('몇 년 치 우리 가족의 시간이, 그대로 잠겨버렸다.')]
      ]), N('잠금 화면 속 우리 가족만, 아무것도 모른 채 웃고 있었다.')]};
    return {chat:'group',beats:[
      N(`${J(n.name,'이')} 책상 서랍에서 노트 한 권을 꺼냈다.`),
      ...pick([
        [NOTE(n,'휴대폰 비밀번호는 여기 적어둘게.'), T(n,'노트에 비밀번호 있었어. 열었어','노트에 비밀번호가 적혀 있었어요. 열었어요'), TP(n,'이거 좋다. 웃고 있네. 이 사진으로 하자','이 사진 좋네요. 웃고 있어요. 이걸로 해요'), N('영정 사진은 내가 제일 좋아하던 사진으로 정해졌다.')],
        [NOTE(n,'비밀번호, 그리고 내가 좋아하는 사진 폴더 이름도 적어둘게.'), T(n,'좋아하는 사진 폴더까지 적어놨더라','좋아하는 사진 폴더까지 적어놨더라고요'), TP(n,'이 사진 진짜 좋아했잖아','이 사진 정말 좋아했어요'), N('영정 사진은 내가 고른 사진이 되었다.')],
        [NOTE(n,'비밀번호는 여기. 사진은 앨범 맨 위 폴더에.'), TP(n,'다들 이 사진 어때?','이 사진 어떠세요?'), ...(o?[TR(o,n,'좋다. 그걸로 하자','좋아요. 그걸로 해요')]:[]), N('사진 속 나는 생각보다 잘 웃고 있었다.')]
      ]), N('사진을 고르는 손끝이, 조금은 덜 떨렸다.')]};}

  case 'drawer':{const n=a.drawer||G('가족'), o=other(a,[n.id]);
    if(U) return {chat:'group',input:true,beats:[
      N(`새벽 두 시, ${J(n.name,'이')} 서랍을 전부 꺼내 바닥에 쏟았다.`),
      ...pick([
        [T(n,'보험 어디 들었는지 아는 사람 있어?','혹시 보험 어디 들었는지 아시는 분 계세요?'), ...(o?[TR(o,n,'글쎄… 들었다고는 했던 것 같은데','글쎄요… 들었다고는 했던 것 같은데요')]:[])],
        [T(n,'보험 증권 같은 거 본 사람 있어?','보험 증권 같은 거 보신 분 계세요?'), ...(o?[TR(o,n,'그런 건 다 알아서 했잖아','그런 건 다 알아서 챙겼잖아요')]:[])],
        [T(n,'보험 서류가 어디 있는지 정말 모르겠어','보험 서류가 어디 있는지 정말 모르겠어요'), ...(o?[TR(o,n,'내일 같이 찾아보자','내일 같이 찾아봐요')]:[])]
      ]),
      N('나는 알고 있었다. 두 번째 서랍, 파란 파일.'), N('알려줄 방법이 없었다.'),
      pick([T(n,'못 찾겠어. 내일 다시 볼게','못 찾겠어요. 내일 다시 볼게요'),T(n,'보험사마다 전화 돌려봐야겠어','보험사마다 전화 돌려봐야겠어요'),T(n,'새벽인데 잠이 안 와','새벽인데 잠이 안 오네요')]),

  const hands=document.getElementById('rwHands');if(hands)hands.classList.add('go');
  setTimeout(()=>{document.documentElement.dataset.mode='warm';},dur*.55);
  (function tick(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);clock.innerHTML=fmt(from-(from-to)*e);

}

/* ---------- 이벤트 ---------- */
function isStory(step){return !['intro','family','check','rewind'].includes(step);}
/* 눈뜨는 연출: 검은 화면에 한 줄이 떴다 사라지고, 눈이 세 번 깜빡이다 열린다. 잠시 뒤 주변이 어두워지며 머리맡 휴대폰(6:40)이 켜지고 진동이 울린다. 그 휴대폰 화면이 커져 화면을 채우면 then()으로 그린 다음 장면이 그 위에 드러난다. 누르면 건너뛴다. */
function eyeOpen(tone,then,fast){
  if(reduce){then();return;}
  busy=true;
  const el=document.createElement('div');el.className='eye '+tone+(fast?' fast':'');
  const line=tone==='cold'?'어젯밤, 평소처럼 잠들었다.':'그리고, 다시 아침.';
  el.innerHTML='<div class="eye-view" aria-hidden="true"></div><i class="eye-hole" aria-hidden="true"></i><p class="eye-line" role="status">'+line+'</p><i class="eye-dim" aria-hidden="true"></i><i class="eye-phone" aria-hidden="true"><b>6:40</b></i>';
  document.body.appendChild(el);
  const t0=performance.now();let done=false,t1,t2;
  const reveal=()=>{if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);busy=false;then();el.classList.add('out');setTimeout(()=>el.remove(),1050);};
  t1=setTimeout(reveal,fast?4700:10700);
  t2=setTimeout(()=>{if(navigator.vibrate)try{navigator.vibrate([150,120,150])}catch(e){}},fast?3600:8700);
  el.addEventListener('click',()=>{if(performance.now()-t0>400)reveal();});
}
function go(delta){
  S.step=Math.max(0,Math.min(STEPS.length-1,S.step+delta));
  S.revealed=delta<0?999:1; if(delta>0)animIdx=0;
  save();render();
}
function autoStep(){
  if(sheet||busy){timer=setTimeout(autoStep,800);return;}
  const step=STEPS[S.step]; if(!isStory(step))return;
  const sc=sceneOf(step); if(pendingAct(sc))return;
  if(S.revealed<=sc.beats.length){S.revealed++;if(S.revealed<=sc.beats.length)animIdx=S.revealed-1;save();render();}
}
function completeAct(v,skipped){
  const st=STEPS[S.step];S.acts[st]=v;
  if(!skipped){S.said=S.said||{};S.said[st]=true;}
  if(!skipped&&typeof v==='string'){S.keeps=S.keeps||{};
    if(st==='u:funeral'&&v!=='제발 싸우지 마')S.keeps.funeral=v;
    if(st==='u:fifth')S.keeps.pet=v;
    if(st==='u:last')S.keeps.reply=v;}
  i_justActed=true;save();render();
}
/* 엔딩노트 앱 연결: 앱 주소가 정해지면 아래에 넣으면 돼요 */
const ENDINGNOTE_URL='';
let showSoon=false;
function handoff(){
  return {version:1,name:S.userName,gender:S.userGender||'',lastWords:S.lastWords||'',
    family:S.family.map(m=>({relation:m.relation,name:m.name,age:m.age||'',gender:m.sg||'',older:m.older})),
    wishes:Object.assign({},S.keeps||{}),checklist:Object.assign({},S.checks)};
}
function toApp(){
  if(ENDINGNOTE_URL){
    const data=btoa(unescape(encodeURIComponent(JSON.stringify(handoff()))));
    window.open(ENDINGNOTE_URL+'#from=story&data='+encodeURIComponent(data),'_blank');
    return;
  }
  showSoon=true;renderCheck();
}
function delMember(id,inSheet){
  if(S.step>=2&&S.family.length<=1){const e=document.getElementById('lerr');if(e)e.textContent='이야기 중에는 가족을 한 명 이상 남겨주세요.';return;}
  S.family=S.family.filter(m=>m.id!==id);save();if(inSheet)renderSheet();render();
}
function handle(act,el){
  switch(act){
    case 'add':openSheet({view:'form',from:sheet&&sheet.view==='list'?'list':'page'});break;
    case 'edit':openSheet({view:'form',id:el.dataset.id,from:sheet&&sheet.view==='list'?'list':'page'});break;
    case 'del':delMember(el.dataset.id,!!sheet);break;
    case 'fam':openSheet({view:'list'});break;
    case 'closeSheet':closeSheet();break;
    case 'toIntro':S.step=0;save();render();break;
    case 'begin':if(S.family.length){S.seed=Math.floor(Math.random()*3);S.acts={};S.said={};eyeOpen('cold',()=>go(1));}break;
    case 'next':if(STEPS[S.step+1]==='ending')eyeOpen('warm',()=>go(1));else go(1);break;
    case 'prev':go(-1);break;
    case 'rewind':doRewind();break;
    case 'restart':S.step=0;S.revealed=1;S.acts={};S.said={};save();render();break;
    case 'replay':eyeOpen('cold',()=>{S.seed=((S.seed||0)+1)%3;S.step=2;S.revealed=1;S.acts={};S.said={};animIdx=0;save();render();},true);break;
    case 'send':completeAct(el.dataset.v);break;
    case 'skip':{const b=sceneOf(STEPS[S.step]).beats[S.revealed-1];completeAct(b.opts[0],true);break;}
    case 'toApp':toApp();break;
  }
}
app.addEventListener('click',e=>{
  if(busy)return;
  const t=e.target.closest('[data-act]');
  if(t){if(!t.disabled)handle(t.dataset.act,t);return;}
  /* 이야기 화면의 빈 곳을 누르면 기다리지 않고 다음 글이 바로 나옴 */
  if(e.target.closest('.scene')&&!e.target.closest('button,a,input,label,.actbox'))hurry();
});
function hurry(){if(sheet||busy||!isStory(STEPS[S.step]))return;clearTimeout(timer);autoStep();}
sheetEl.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.classList.contains('overlay')&&e.target!==t)return;handle(t.dataset.act,t);});
app.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ck;
  if(k){S.checks[k]=e.target.checked;save();renderCheck();const box=app.querySelector(`[data-ck="${k}"]`);if(box)box.focus();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet){closeSheet();return;}
  const eye=document.querySelector('.eye');
  if(eye&&!eye.classList.contains('out')&&(e.key==='Escape'||e.key==='Enter'||e.key===' ')){e.preventDefault();eye.click();return;}
  if(sheet||busy)return;
  if((e.key===' '||e.key==='ArrowRight')&&(e.target===document.body||e.target.closest('.feed'))){e.preventDefault();hurry();}
});
if(S.step>=2&&!S.family.length)S.step=1;
render();
})();
</script>
