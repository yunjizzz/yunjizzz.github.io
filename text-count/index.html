  <style>
    /* ==============================
       DESIGN TOKENS
    ============================== */
    :root {
      --bg: #f7fdf9;
      --bg-soft: #edf7f2;
      --card: #ffffff;
      --border: #d0eadf;
      --text: #111c16;
      --muted: #607a6e;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-light: #d1fae5;
      --accent2: #06b6d4;
      --shadow: 0 2px 8px rgba(15, 17, 21, 0.06), 0 1px 3px rgba(15, 17, 21, 0.04);
      --shadow-md: 0 4px 20px rgba(16, 185, 129, 0.1), 0 2px 8px rgba(15, 17, 21, 0.06);
      --shadow-lg: 0 8px 40px rgba(16, 185, 129, 0.15), 0 4px 16px rgba(15, 17, 21, 0.08);
      --glow: rgba(16, 185, 129, 0.15);
      --radius: 16px;
      --radius-sm: 10px;
    }

    /* ==============================
       RESET & BASE
    ============================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ==============================
       HEADER
    ============================== */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      transition: color 200ms ease;
      flex-shrink: 0;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { flex-shrink: 0; }

    .header-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      flex: 1;
    }

    /* ==============================
       PRIVACY BANNER
    ============================== */
    .privacy-banner {
      background: var(--accent-light);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
    }

    .privacy-banner-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .privacy-banner-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .privacy-banner-icon svg { color: #fff; }

    .privacy-banner-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    /* ==============================
       MAIN LAYOUT
    ============================== */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ==============================
       TEXTAREA SECTION
    ============================== */
    .textarea-section {
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    .text-input {
      width: 100%;
      height: 400px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
      font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      resize: none;
      overflow-y: auto;
      outline: none;
      transition: border-color 200ms ease, box-shadow 200ms ease;
      box-shadow: var(--shadow);
    }
    .text-input::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }
    .text-input:focus {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    /* ==============================
       ACTION BUTTONS
    ============================== */
    .action-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease, transform 200ms ease;
    }
    .action-btn:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn:focus { outline: none; }
    .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ==============================
       STATS GRID
    ============================== */
    .stats-section {
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }
    .stat-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .stat-icon svg { color: var(--accent); }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    /* ==============================
       HELP TEXT
    ============================== */
    .help-section {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .help-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .help-icon {
      font-size: 20px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .help-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 500;
    }

    .help-text strong { color: var(--text); font-weight: 700; }

    /* ==============================
       SCROLLBAR (macOS에서 항상 표시)
    ============================== */
    .text-input::-webkit-scrollbar {
      width: 10px;
      cursor: default;
    }
    .text-input::-webkit-scrollbar-track {
      background: transparent;
      margin: 12px 0;
    }
    .text-input::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 5px;
      cursor: default;
    }
    .text-input::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
      cursor: default;
    }

    /* ==============================
       ANIMATIONS
    ============================== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==============================
       RESPONSIVE
    ============================== */
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .header-inner { padding: 0 16px; }
      .main { padding: 24px 16px 60px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 400px) {
      .header-title { font-size: 14px; }
      .back-link span { display: none; }
    }

    /* ==============================
       LANGUAGE SELECTOR
    ============================== */
    .lang-select {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 200ms ease;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23607a6e' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 24px;
    }
    .lang-select:focus { outline: none; border-color: var(--accent); }
  </style>
</head>

  <!-- ==============================

  ============================== -->
  <div class="privacy-banner" role="note" aria-label="개인정보 보호 안내">

      <div class="privacy-banner-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <p class="privacy-banner-text" data-i18n="privacyText">모든 텍스트는 브라우저에서 처리되며 서버에 전송되지 않습니다</p>
    </div>
  </div>

  <!-- ==============================
       MAIN
  ============================== -->
  <main class="main" id="app">

    <!-- Textarea -->
    <section class="textarea-section" aria-label="텍스트 입력">
      <textarea class="text-input" id="text-input" placeholder="텍스트를 입력하세요..." data-i18n-placeholder="textareaPlaceholder" aria-label="분석할 텍스트 입력"></textarea>
    </section>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="action-btn" id="copy-btn" aria-label="텍스트 복사">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span data-i18n="copyBtn">복사</span>
      </button>
      <button class="action-btn" id="clear-btn" aria-label="텍스트 초기화">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        <span data-i18n="clearBtn">초기화</span>
      </button>
    </div>

    <!-- Stats Grid -->
    <section class="stats-section" aria-label="텍스트 분석 결과">
      <div class="stats-grid">
        <!-- 공백 포함 -->
        <div class="stat-card">
          <div class="stat-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>
            </svg>
          </div>
          <span class="stat-label" data-i18n="statChars">공백 포함</span>
          <span class="stat-value" id="stat-chars">0</span>
        </div>
        <!-- 공백 제외 -->
        <div class="stat-card">
          <div class="stat-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>

          <span class="stat-label" data-i18n="statCharsNoSpace">공백 제외</span>
          <span class="stat-value" id="stat-chars-no-space">0</span>
        </div>
        <!-- 단어 수 -->
        <div class="stat-card">
          <div class="stat-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </div>
          <span class="stat-label" data-i18n="statWords">단어 수</span>
          <span class="stat-value" id="stat-words">0</span>
        </div>
        <!-- 줄 수 -->
        <div class="stat-card">
          <div class="stat-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="21" y1="6" x2="3" y2="6"/><line x1="17" y1="12" x2="3" y2="12"/><line x1="21" y1="18" x2="3" y2="18"/>

          </div>

          <span class="stat-value" id="stat-bytes">0</span>
        </div>
      </div>
    </section>

    <!-- Help Text -->
    <aside class="help-section" aria-label="도움말">
      <div class="help-card">
        <span class="help-icon" aria-hidden="true">💡</span>
        <p class="help-text" data-i18n="helpText" data-i18n-html>
          텍스트를 입력하면 <strong>글자수, 단어수, 줄수, 문장수, 바이트수</strong>를 실시간으로 분석합니다.
          바이트 수는 <strong>UTF-8</strong> 인코딩 기준이며, 한글은 글자당 3바이트입니다.
          문장 수는 마침표(.), 느낌표(!), 물음표(?) 기준으로 세어집니다.
        </p>
      </div>
